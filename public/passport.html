<!doctype html>
<html lang="ml">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f4c4a" />
    <title>Passport · BhashaBridge</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <style>
      /* passport page: builds on style.css */
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        background: linear-gradient(135deg, #fff, #eefaf3);
      }
      .hero h1 {
        font-size: 1.35rem;
        margin: 0;
      }
      .hero .note {
        margin: 2px 0 0;
      }
      .ring {
        position: relative;
        flex: none;
        width: 112px;
        height: 112px;
      }
      .ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .ring circle {
        fill: none;
        stroke-width: 11;
        stroke-linecap: round;
      }
      .ring .rt {
        stroke: #e3eee8;
      }
      .ring .rf {
        stroke: var(--leaf);
        stroke-dasharray: 314.16;
        stroke-dashoffset: 314.16;
        transition:
          stroke-dashoffset 1s cubic-bezier(0.2, 0.8, 0.2, 1),
          stroke 0.4s;
      }
      .ring.mid .rf {
        stroke: var(--gold);
      }
      .ring.low .rf {
        stroke: var(--hib);
      }
      .ring.none .rf {
        stroke: #9db3ab;
      }
      .rv {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        line-height: 1.1;
      }
      .rv b {
        font-size: 1.9rem;
        color: var(--green);
      }
      .rv small {
        font-size: 0.68rem;
        color: var(--mute);
        font-weight: 700;
      }
      .radar {
        position: relative;
        max-width: 300px;
        margin: 6px auto 0;
      }
      .radar svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .radar .g {
        fill: none;
        stroke: var(--line);
        stroke-width: 1.5;
      }
      .radar .ax {
        stroke: var(--line);
        stroke-width: 1.5;
      }
      .radar .poly {
        fill: #2f8f6b40;
        stroke: var(--leaf);
        stroke-width: 3;
        stroke-linejoin: round;
      }
      .radar .pt {
        fill: #fff;
        stroke: var(--leaf);
        stroke-width: 3;
      }
      .lab {
        position: absolute;
        transform: translate(-50%, -50%);
        text-align: center;
        font-size: 0.82rem;
        font-weight: 800;
        line-height: 1.25;
        white-space: nowrap;
      }
      .lab i {
        display: block;
        font-style: normal;
        color: var(--leaf);
        font-size: 1rem;
      }
      .tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .tab s {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9db3ab;
        display: inline-block;
      }
      .tab s.good {
        background: var(--leaf);
      }
      .tab s.mid {
        background: var(--gold);
      }
      .tab s.low {
        background: var(--hib);
      }
      .tab.on s {
        box-shadow: 0 0 0 2px #fff;
      }
      .sw {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--mute);
        cursor: pointer;
        margin: 0 0 6px;
      }
      .sw input {
        position: absolute;
        opacity: 0;
      }
      .sw .kn {
        width: 46px;
        height: 26px;
        border-radius: 99px;
        background: #c9d6cf;
        position: relative;
        transition: background 0.2s;
        flex: none;
      }
      .sw .kn::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 4px #0003;
        transition: transform 0.2s;
      }
      .sw input:checked + .kn {
        background: var(--leaf);
      }
      .sw input:checked + .kn::after {
        transform: translateX(20px);
      }
      .sw input:focus-visible + .kn {
        outline: 3px solid var(--gold);
      }
      .dots2 {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 2px;
      }
      .dot {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 0;
        font-size: 0.85rem;
        font-weight: 800;
        color: #fff;
        background: var(--leaf);
        box-shadow: 0 3px 0 #0b5a3a;
        transition: transform 0.12s;
      }
      .dot.fail {
        background: var(--hib);
        box-shadow: 0 3px 0 #8b1c46;
      }
      .dot.low {
        background: #fff;
        color: var(--mute);
        border: 3px dashed var(--mute);
        box-shadow: none;
      }
      .dot.low.fail {
        color: var(--hib);
        border-color: var(--hib);
      }
      .dot.low.pass {
        color: var(--leaf);
        border-color: var(--leaf);
      }
      .dot:hover {
        transform: scale(1.12);
      }
      .dot.sel {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
      .pop {
        background: #f3faf6;
        border-radius: 16px;
        padding: 10px 14px;
        margin-top: 8px;
        font-size: 0.9rem;
        animation: rise 0.25s;
      }
      .pop b {
        color: var(--green);
      }
      .mchips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .mchip {
        border: 2px solid var(--hib);
        background: #fde4ed;
        color: #8b1c46;
        border-radius: 14px;
        padding: 2px 12px;
        font-weight: 800;
        font-size: 0.88rem;
        text-align: left;
      }
      .mchip.on {
        background: var(--hib);
        color: #fff;
      }
      .mcard {
        margin-top: 12px;
        border-left: 6px solid var(--hib);
        background: #fff;
        border-radius: 16px;
        padding: 12px 16px;
        box-shadow: var(--lift);
        animation: rise 0.25s;
        position: relative;
        padding-right: 70px;
      }
      .mcard .listen {
        top: 12px;
      }
      .actions {
        display: flex;
        gap: 12px;
      }
      .actions > * {
        flex: 1;
        text-decoration: none;
        text-align: center;
        padding-top: 14px;
      }
    </style>
  </head>
  <body data-lang="ml">
    <header>
      <a
        class="brand"
        href="index.html"
        style="color: inherit; text-decoration: none"
        ><img src="icon.svg" alt="" width="30" height="30" /><b
          >BhashaBridge</b
        ></a
      >
      <div class="tools">
        <div class="seg" role="group" aria-label="Language">
          <button data-lang="ml">മല</button
          ><button data-lang="both">മല+EN</button
          ><button data-lang="en">EN</button>
        </div>
      </div>
    </header>
    <main id="main">
      <div id="app" aria-live="polite"><p class="boot">…</p></div>
    </main>
    <script src="store.js"></script>
    <script src="rules.js"></script>
    <script>
      (async () => {
        const G = ["understand", "express", "apply"],
          $ = (s, r = document) => r.querySelector(s),
          $$ = (s, r = document) => [...r.querySelectorAll(s)];
        const esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const bi = (o) =>
          `<span class="bi"><span class="ml" lang="ml">${esc(o?.ml)}</span><span class="en" lang="en">${esc(o?.en)}</span></span>`;
        /* page text (P1: please have the Malayalam checked) */
        const T = {
          title: { ml: "പഠന പാസ്പോർട്ട്", en: "Learning Passport" },
          answers: { ml: "ഉത്തരങ്ങൾ", en: "answers" },
          overall: { ml: "മൊത്തത്തിൽ", en: "overall" },
          off: {
            ml: "ഓഫ്‌ലൈൻ ഉത്തരങ്ങളും ഉൾപ്പെടുത്തൂ",
            en: "Include offline answers",
          },
          lowc: {
            ml: "ഓഫ്‌ലൈൻ / കുറഞ്ഞ ഉറപ്പ്",
            en: "offline / lower confidence",
          },
          hint: {
            ml: "ഓരോ ഡോട്ടും തൊട്ടുനോക്കൂ",
            en: "Tap a dot to see the answer",
          },
          work: { ml: "ശ്രദ്ധിക്കേണ്ട ആശയങ്ങൾ", en: "Ideas to work on" },
          nomis: {
            ml: "ഇപ്പോൾ തെറ്റിദ്ധാരണകളൊന്നും രേഖപ്പെടുത്തിയിട്ടില്ല. 🎉",
            en: "No misconceptions recorded right now.",
          },
          ok: { ml: "ശരി", en: "Correct" },
          no: { ml: "ഇനിയും പഠിക്കാം", en: "Keep practising" },
          on: { ml: "ഓൺലൈൻ", en: "Online" },
          offl: { ml: "ഓഫ്‌ലൈൻ", en: "Offline" },
          noev: {
            ml: "ഈ വിഷയത്തിൽ ഇതുവരെ ഉത്തരങ്ങളില്ല. ഒരു പഠനസെഷൻ കഴിഞ്ഞാൽ ഇവിടെ കാണാം.",
            en: "No answers for this topic yet. Finish a session and they will appear here.",
          },
          nochild: {
            ml: "ആദ്യം ആപ്പിൽ ഒരു കുട്ടിയെ തിരഞ്ഞെടുക്കൂ.",
            en: "Pick a child in the app first.",
          },
          samplelink: {
            ml: "സാമ്പിൾ പാസ്പോർട്ട് കാണൂ",
            en: "View sample passport",
          },
          sample: { ml: "സാമ്പിൾ വിവരം", en: "Sample data" },
          print: { ml: "പ്രിന്റ് ചെയ്യൂ", en: "Print" },
          foot: {
            ml: "ഇത് ഇപ്പോഴത്തെ ഒരു ചിത്രം മാത്രമാണ്, സ്ഥിരമായ ഒരു മുദ്രയല്ല. ഓഫ്‌ലൈൻ ഉത്തരങ്ങൾക്ക് പകുതി വില മാത്രം.",
            en: "This is a snapshot, never a permanent label. Offline answers count half.",
          },
        };
        const NEXT_ML = {
          understand:
            "ഒരു പുതിയ ദൈനംദിന ഉദാഹരണം എടുത്ത് എന്ത് സംഭവിക്കുമെന്ന് പ്രവചിച്ചു നോക്കൂ.",
          express:
            "മലയാളം-ഇംഗ്ലീഷ് വാക്കുകൾ പഠിച്ച ശേഷം ഇംഗ്ലീഷിൽ ഉത്തരം പറയൂ.",
          apply: "സൂചനകൾ കുറച്ച് ഒരു പുതിയ സാഹചര്യം ചെയ്തുനോക്കൂ.",
        };
        const setLang = (l) => {
          document.body.dataset.lang = l;
          document.documentElement.lang = l === "en" ? "en" : "ml";
          localStorage.setItem("bb_lang", l);
        };
        $$(".seg button").forEach(
          (b) => (b.onclick = () => setLang(b.dataset.lang)),
        );
        setLang(localStorage.getItem("bb_lang") || "ml");
        const app = $("#app"),
          q = new URLSearchParams(location.search),
          sample = q.get("sample") === "1" || q.get("demo") === "1",
          childId = q.get("child") || "";
        let pack;
        try {
          pack = await (await fetch("pack.json")).json();
        } catch (e) {
          app.innerHTML =
            '<div class="card">Could not load pack.json. Please reload.</div>';
          return;
        }
        const U = (k) => pack.ui[k] || { ml: k, en: k };
        if (!childId && !sample) {
          app.innerHTML = `<div class="card center"><p class="big">${bi(T.nochild)}</p><a class="btn" href="index.html" style="text-decoration:none;padding-top:14px">${bi(U("home") || { ml: "ഹോം", en: "Home" })}</a><a class="btn alt" href="?sample=1" style="text-decoration:none;padding-top:14px">${bi(T.samplelink)}</a></div>`;
          return;
        }
        let kid;
        try {
          kid = JSON.parse(localStorage.getItem("bb_children") || "[]").find(
            (k) => k.id === childId,
          );
        } catch (e) {}
        const mk = (gate, result, conf = "high", mis) => ({
          gate,
          result,
          confidence: conf,
          source: conf === "low" ? "offline" : "online",
          misconception: mis,
        });
        const sampleEv = (cid) => {
          const m = pack.misconceptions.find((x) => x.concept === cid)?.id;
          return [
            mk("understand", "fail", "high", m),
            mk("understand", "pass"),
            mk("understand", "pass"),
            mk("understand", "pass", "low"),
            mk("express", "fail"),
            mk("express", "fail"),
            mk("express", "pass"),
            mk("express", "pass", "low"),
            mk("apply", "pass"),
            mk("apply", "pass"),
            mk("apply", "fail", "high", m),
            mk("apply", "pass"),
          ].map((e, i) => ({
            ...e,
            concept: cid,
            ts: Date.now() - (12 - i) * 3600e3,
          }));
        };
        const all = sample
          ? pack.concepts.flatMap((c) => sampleEv(c.id))
          : loadEvidence(childId);
        const S = {
          cid: pack.concepts.some((c) => c.id === q.get("concept"))
            ? q.get("concept")
            : [...all].sort((a, b) => b.ts - a.ts)[0]?.concept ||
              pack.concepts[0].id,
          off: true,
          dot: "",
          mis: "",
        };
        const view = (cid) =>
          all.filter(
            (e) =>
              e.concept === cid &&
              (S.off || (e.confidence !== "low" && e.source !== "offline")),
          );
        const cls = (s) =>
          s.n < 3
            ? "none"
            : s.label === "strong"
              ? "good"
              : s.label === "developing"
                ? "mid"
                : "low";
        const stateOf = (cid) => {
          const ev = view(cid),
            st = G.map((g) => ({
              g,
              ...gateState(ev, cid, g),
              items: ev.filter((e) => e.gate === g).sort((a, b) => a.ts - b.ts),
            })),
            r = st.filter((s) => s.n),
            tot = r.reduce((a, s) => a + s.n, 0),
            avg = r.length
              ? r.reduce((a, s) => a + s.estimate, 0) / r.length
              : 0;
          return {
            ev,
            st,
            tot,
            avg,
            k:
              tot < 3
                ? "none"
                : avg >= 0.7
                  ? "good"
                  : avg >= 0.45
                    ? "mid"
                    : "low",
          };
        };
        const AX = [-90, 30, 150].map((a) => [
            Math.cos((a * Math.PI) / 180),
            Math.sin((a * Math.PI) / 180),
          ]),
          CX = 110,
          CY = 108,
          R = 78;
        const pts = (v) =>
          v.map(
            (x, i) =>
              `${(CX + R * x * AX[i][0]).toFixed(1)},${(CY + R * x * AX[i][1]).toFixed(1)}`,
          );
        const LP = ["left:50%;top:5%", "left:88%;top:88%", "left:12%;top:88%"];
        let cur = [0, 0, 0],
          curPct = 0,
          raf = 0;
        const paint = (v, pct) => {
          const p = $(".poly");
          if (!p) return;
          p.setAttribute("points", pts(v).join(" "));
          $$(".pt").forEach((c, i) => {
            const [x, y] = pts(v)[i].split(",");
            c.setAttribute("cx", x);
            c.setAttribute("cy", y);
          });
          const n = $("#pct");
          if (n) n.textContent = Math.round(pct);
        };
        const tween = (to, pct) => {
          cancelAnimationFrame(raf);
          if (matchMedia("(prefers-reduced-motion:reduce)").matches) {
            cur = to;
            curPct = pct;
            return paint(to, pct);
          }
          const f0 = cur.slice(),
            p0 = curPct,
            t0 = performance.now();
          (function f(t) {
            const k = Math.min(1, (t - t0) / 700),
              e = 1 - Math.pow(1 - k, 3);
            cur = f0.map((v, i) => v + (to[i] - v) * e);
            curPct = p0 + (pct - p0) * e;
            paint(cur, curPct);
            if (k < 1) raf = requestAnimationFrame(f);
          })(t0);
        };
        const when = (ts) =>
          new Date(ts).toLocaleString(undefined, {
            day: "numeric",
            month: "short",
            hour: "2-digit",
            minute: "2-digit",
          });

        function render() {
          const { ev, st, tot, avg, k } = stateOf(S.cid),
            c = pack.concepts.find((x) => x.id === S.cid),
            na = nextActivity(ev, S.cid),
            nm = pack.next_activity?.[na.gate];
          const ranked = [...st].sort(
            (a, b) => (b.n >= 3) - (a.n >= 3) || b.estimate - a.estimate,
          ); /* strengths first */
          const fails = {};
          ev.forEach((e) => {
            if (
              e.result === "fail" &&
              pack.misconceptions.some((m) => m.id === e.misconception)
            )
              fails[e.misconception] = (fails[e.misconception] || 0) + 1;
          });
          const mis = pack.misconceptions.find(
            (m) => m.id === S.mis && fails[m.id],
          );
          const vals = st.map((s) => (s.n ? s.estimate : 0)),
            pctNow = avg * 100;
          app.innerHTML = `
    <section class="card hero"><div><div class="who"><span class="av">${kid ? kid.emoji : "🌼"}</span><div><h1>${bi(T.title)}</h1><p class="note">${kid ? esc(kid.nick) + " · " : ""}${esc(pack.chapter)}</p></div></div>${sample ? `<span class="chip">${bi(T.sample)}</span>` : ""}</div>
      <div class="ring ${k}" id="ring"><svg viewBox="0 0 120 120"><circle class="rt" cx="60" cy="60" r="50"/><circle class="rf" cx="60" cy="60" r="50"/></svg><div class="rv"><b id="pct">0</b><small>% ${bi(T.overall)}</small></div></div></section>
    <div class="tabs" role="tablist">${pack.concepts.map((x) => `<button class="tab ${x.id === S.cid ? "on" : ""}" role="tab" aria-selected="${x.id === S.cid}" data-cid="${x.id}"><s class="${stateOf(x.id).k === "none" ? "" : stateOf(x.id).k}"></s>${bi(x.title)}</button>`).join("")}</div>
    <label class="sw noprint"><input type="checkbox" id="off" ${S.off ? "checked" : ""}><span class="kn"></span><span>${bi(T.off)}</span></label>
    <section class="card"><div class="radar"><svg viewBox="0 0 220 210" role="img" aria-label="Understand, Express, Apply">${[1, 0.66, 0.33].map((r) => `<polygon class="g" points="${pts([r, r, r]).join(" ")}"/>`).join("")}${AX.map((a) => `<line class="ax" x1="${CX}" y1="${CY}" x2="${CX + R * a[0]}" y2="${CY + R * a[1]}"/>`).join("")}<polygon class="poly" points="${pts(cur).join(" ")}"/>${[0, 1, 2].map(() => '<circle class="pt" r="5"/>').join("")}</svg>
      ${st.map((s, i) => `<div class="lab" style="${LP[i]}">${bi(U("gate_" + s.g))}<i>${s.n ? Math.round(s.estimate * 100) + "%" : "–"}</i></div>`).join("")}</div></section>
    ${ranked
      .map((s) => {
        const lab =
            s.n < 3
              ? U("not_enough_evidence")
              : U(
                  s.label === "strong"
                    ? "level_strong"
                    : s.label === "developing"
                      ? "level_developing"
                      : "level_needs_support",
                ),
          low = s.items.filter(
            (e) => e.confidence === "low" || e.source === "offline",
          ).length,
          sel = S.dot.startsWith(s.g + ":")
            ? s.items[+S.dot.split(":")[1]]
            : null;
        return `<article class="card strand ${cls(s) === "good" ? "" : cls(s)}"><div class="srow"><b>${bi(U("gate_" + s.g))}</b><span class="badge ${cls(s)}">${bi(lab)}</span></div>
        <div class="bar"><i style="width:${s.n ? Math.round(s.estimate * 100) : 0}%"></i></div>
        <p class="note" style="margin:0">${s.n} ${bi(T.answers)}${low ? `<span class="lowc">${low} ${bi(T.lowc)}</span>` : ""}</p>
        ${s.items.length ? `<div class="dots2">${s.items.map((e, i) => `<button class="dot ${e.result} ${e.confidence === "low" ? "low" : ""} ${S.dot === s.g + ":" + i ? "sel" : ""}" data-dot="${s.g}:${i}" aria-label="${e.result}">${e.result === "pass" ? "✓" : "✗"}</button>`).join("")}</div>` : ""}
        ${sel ? `<div class="pop"><b>${bi(sel.result === "pass" ? T.ok : T.no)}</b> · ${bi(sel.source === "offline" ? T.offl : T.on)} · ${esc(when(sel.ts))}${pack.misconceptions.find((m) => m.id === sel.misconception) ? "<br>" + esc(pack.misconceptions.find((m) => m.id === sel.misconception).description_en) : ""}</div>` : s.items.length ? `<p class="note noprint" style="margin:6px 0 0;font-size:.8rem">${bi(T.hint)}</p>` : ""}</article>`;
      })
      .join("")}
    <section class="card"><b>${bi(T.work)}</b><div class="mchips" style="margin-top:8px">${
      Object.keys(fails).length
        ? Object.entries(fails)
            .map(
              ([id, n]) =>
                `<button class="mchip ${id === S.mis ? "on" : ""}" data-mis="${id}">${esc(pack.misconceptions.find((m) => m.id === id).description_en.replace(/^Thinks /, ""))} · ${n}</button>`,
            )
            .join("")
        : `<span class="note">${bi(T.nomis)}</span>`
    }</div>
      ${mis ? `<div class="mcard"><p class="big" style="font-size:1.05rem">${bi(mis.explanation)}</p>${mis.explanation.audio ? `<button class="listen" data-audio="${esc(mis.explanation.audio)}" aria-label="Listen">🔊</button>` : ""}</div>` : ""}</section>
    <section class="card next"><b>${bi(U("your_next_15"))}</b><p class="big"><span class="ml" lang="ml">${esc(nm?.ml || NEXT_ML[na.gate])}</span><span class="en" lang="en">${esc(nm?.en || na.text)}</span></p>
      <div class="actions noprint"><a class="btn gold" href="index.html">${bi(U("start_session"))}</a><button class="btn alt" id="print">🖨 ${bi(T.print)}</button></div></section>
    <p class="note">${bi(T.foot)}</p>`;
          paint(cur, curPct);
          tween(vals, pctNow);
          const ring = $("#ring");
          requestAnimationFrame(
            () =>
              (ring.querySelector(".rf").style.strokeDashoffset =
                314.16 * (1 - avg)),
          );
          if (!ev.length)
            app.insertAdjacentHTML(
              "afterbegin",
              `<div class="card center"><p class="note" style="margin:0">${bi(T.noev)}</p></div>`,
            );
        }
        app.addEventListener("click", (e) => {
          const t = e.target.closest("button");
          if (!t) return;
          if (t.dataset.cid) {
            S.cid = t.dataset.cid;
            S.dot = S.mis = "";
            history.replaceState(
              null,
              "",
              "?" +
                new URLSearchParams({
                  ...Object.fromEntries(q),
                  concept: S.cid,
                }),
            );
            render();
          } else if (t.dataset.dot) {
            S.dot = S.dot === t.dataset.dot ? "" : t.dataset.dot;
            render();
          } else if (t.dataset.mis) {
            S.mis = S.mis === t.dataset.mis ? "" : t.dataset.mis;
            render();
          } else if (t.classList.contains("listen")) {
            const a = new Audio(t.dataset.audio);
            a.play().catch(() => {});
          } else if (t.id === "print") print();
        });
        app.addEventListener("change", (e) => {
          if (e.target.id === "off") {
            S.off = e.target.checked;
            render();
          }
        });
        app.addEventListener("keydown", (e) => {
          const t = e.target.closest(".tab");
          if (!t || !/Arrow(Left|Right)/.test(e.key)) return;
          const tabs = $$(".tab"),
            i = tabs.indexOf(t) + (e.key === "ArrowRight" ? 1 : -1);
          tabs[(i + tabs.length) % tabs.length].click();
          setTimeout(() => $(".tab.on")?.focus());
        });
        render();
      })();
    </script>
  </body>
</html>
