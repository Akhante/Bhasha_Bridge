<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#174a40" />
		<title>Learning Passport · BhashaBridge</title>
		<link rel="icon" href="icon.svg" type="image/svg+xml" />
		<style>
			:root {
				--bg: #f3f6f1;
				--ink: #173c36;
				--muted: #62756f;
				--line: #dce5dd;
				--card: #fff;
				--green: #237b5c;
				--gold: #a87315;
				--coral: #b94e35;
				--track: #e2e8e1;
				--blue: #3e7184;
			}
			* { box-sizing: border-box; }
			body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "Aptos", "Segoe UI", sans-serif; }
			header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px max(20px, calc((100vw - 850px) / 2)); background: #174a40; color: #fff; }
			.brand { display: flex; align-items: center; gap: 10px; font-weight: 750; text-decoration: none; }
			.brand img { width: 30px; height: 30px; }
			.home { color: #e2eee6; font-size: .9rem; text-decoration-thickness: 1px; text-underline-offset: 4px; }
			main { width: min(100% - 36px, 850px); margin: 0 auto; padding: 38px 0 56px; }
			.eyebrow { margin: 0 0 5px; color: var(--green); font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
			h1, h2, p { margin-top: 0; }
			h1 { margin-bottom: 5px; font: 500 2rem/1.2 Georgia, "Times New Roman", serif; }
			.subtitle { margin-bottom: 26px; color: var(--muted); }
			.progress-section { padding: 20px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
			.section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
			.section-heading h2 { margin: 0; font-size: 1.05rem; }
			.concept { color: var(--muted); font-size: .84rem; text-align: right; }
			.strand { padding: 17px 0; border-top: 1px solid var(--line); }
			.strand:first-child { border-top: 0; }
			.strand-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
			.strand-name { font-weight: 750; }
			.label { color: var(--muted); font-size: .82rem; font-weight: 700; }
			.label.strong { color: var(--green); }
			.label.developing { color: var(--gold); }
			.label.support { color: var(--coral); }
			.bar { height: 10px; margin: 10px 0 7px; overflow: hidden; border-radius: 8px; background: var(--track); }
			.fill { height: 100%; border-radius: inherit; background: var(--green); transition: width 450ms ease; }
			.fill.developing { background: #d19a32; }
			.fill.support { background: #c76146; }
			.strand-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--muted); font-size: .82rem; }
			.offline { color: var(--blue); }
			.next { display: grid; grid-template-columns: 38px 1fr; gap: 13px; align-items: start; margin-top: 20px; padding: 19px 22px; background: #174a40; color: #fff; border-radius: 10px; }
			.next-mark { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #8cc4a5; border-radius: 50%; color: #bce3c8; font-size: 1.1rem; }
			.next h2 { margin: 0 0 4px; font-size: .78rem; letter-spacing: .06em; }
			.next p { margin: 0; color: #e5f1e8; font: 1.08rem/1.45 Georgia, "Times New Roman", serif; }
			.empty { margin: 8px 0 4px; color: var(--muted); }
			.error { color: var(--coral); }
			@media (max-width: 520px) {
				header { padding-inline: 16px; }
				main { width: min(100% - 28px, 850px); padding-top: 27px; }
				h1 { font-size: 1.75rem; }
				.progress-section { padding: 17px 16px; }
				.section-heading { align-items: start; flex-direction: column; }
				.concept { text-align: left; }
				.strand-head { align-items: start; flex-direction: column; gap: 2px; }
				.strand-foot { align-items: start; flex-direction: column; gap: 2px; }
			}
			@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
		</style>
	</head>
	<body>
		<header>
			<a class="brand" href="index.html"><img src="icon.svg" alt="" /><span>BhashaBridge</span></a>
			<a class="home" href="index.html">Back to learning</a>
		</header>
		<main>
			<p class="eyebrow">Learning record</p>
			<h1 id="title">Learning Passport</h1>
			<p class="subtitle" id="subtitle" aria-live="polite">Loading progress…</p>
			<section class="progress-section" aria-labelledby="progress-title">
				<div class="section-heading">
					<h2 id="progress-title">Progress across three strands</h2>
					<span id="concept" class="concept"></span>
				</div>
				<div id="strands" aria-live="polite"></div>
			</section>
			<section class="next" aria-live="polite">
				<span class="next-mark" aria-hidden="true">↗</span>
				<div><h2>NEXT ACTIVITY</h2><p id="nextText"></p></div>
			</section>
		</main>
		<script src="store.js"></script>
		<script src="rules.js"></script>
		<script>
			(() => {
				const childId = new URLSearchParams(location.search).get("child") || "S01";
				const strands = [
					{ gate: "understand", name: "Understand" },
					{ gate: "express", name: "Express" },
					{ gate: "apply", name: "Apply" },
				];
				const byId = id => document.getElementById(id);

				function evidenceForChild() {
					const evidence = loadEvidence(childId);
					return Array.isArray(evidence) ? evidence : [];
				}

				function labelClass(label) {
					if (label === "strong") return "strong";
					if (label === "developing") return "developing";
					if (label === "needs support") return "support";
					return "none";
				}

				function renderStrand(strand, conceptEvidence, conceptId) {
					const state = gateState(conceptEvidence, conceptId, strand.gate);
					const tone = labelClass(state.label);
					const offline = conceptEvidence.filter(item =>
						item.gate === strand.gate && (item.confidence === "low" || item.source === "offline")
					).length;
					const percent = state.n ? Math.round(state.estimate * 100) : 0;
					const article = document.createElement("article");
					article.className = "strand";

					const head = document.createElement("div");
					head.className = "strand-head";
					const name = document.createElement("span");
					name.className = "strand-name";
					name.textContent = strand.name;
					const label = document.createElement("span");
					label.className = `label ${tone}`;
					label.textContent = state.label;
					head.append(name, label);

					const bar = document.createElement("div");
					bar.className = "bar";
					bar.setAttribute("role", "img");
					bar.setAttribute("aria-label", `${strand.name}: ${state.label}, ${state.n} evidence items`);
					const fill = document.createElement("div");
					fill.className = `fill ${tone}`;
					fill.style.width = `${percent}%`;
					bar.append(fill);

					const foot = document.createElement("div");
					foot.className = "strand-foot";
					const count = document.createElement("span");
					count.textContent = `n = ${state.n} ${state.n === 1 ? "answer" : "answers"}`;
					foot.append(count);
					if (offline) {
						const flag = document.createElement("span");
						flag.className = "offline";
						flag.textContent = `${offline} offline ${offline === 1 ? "answer" : "answers"} · lower confidence`;
						foot.append(flag);
					}
					article.append(head, bar, foot);
					return { element: article, estimate: state.estimate, n: state.n, strand };
				}

				async function render() {
					const [allEvidence, response] = await Promise.all([
						Promise.resolve(evidenceForChild()),
						fetch("pack.json"),
					]);
					if (!response.ok) throw new Error("Learning content could not be loaded.");
					const pack = await response.json();
					const conceptIds = new Set(pack.concepts.map(concept => concept.id));
					const latest = [...allEvidence]
						.filter(item => conceptIds.has(item.concept))
						.sort((a, b) => (b.ts || 0) - (a.ts || 0))[0];
					const concept = pack.concepts.find(item => item.id === latest?.concept) || pack.concepts[0];
					const conceptId = concept?.id;
					const localChildren = JSON.parse(localStorage.getItem("bb_children") || "[]");
					const child = Array.isArray(localChildren) ? localChildren.find(item => item.id === childId) : null;
					const childName = child?.nick || `Child ${childId}`;
					const conceptEvidence = allEvidence.filter(item => item.concept === conceptId);

					byId("title").textContent = `${childName}'s Learning Passport`;
					byId("subtitle").textContent = conceptEvidence.length
						? "A snapshot of learning from recent practice."
						: "No learning evidence recorded for this child yet.";
					byId("concept").textContent = concept?.title?.en || pack.chapter || "";

					const ranked = strands
						.map(strand => renderStrand(strand, conceptEvidence, conceptId))
						.sort((a, b) => {
							const aReady = a.n >= 3 ? 1 : 0;
							const bReady = b.n >= 3 ? 1 : 0;
							return bReady - aReady || b.estimate - a.estimate || strands.indexOf(a.strand) - strands.indexOf(b.strand);
						});
					byId("strands").replaceChildren(...ranked.map(item => item.element));
					byId("nextText").textContent = nextActivity(allEvidence, conceptId).text;
				}

				render().catch(error => {
					byId("subtitle").textContent = "Could not load learning progress.";
					byId("strands").textContent = error.message || "Please reload this page and try again.";
					byId("strands").className = "empty error";
					byId("nextText").textContent = "";
				});
			})();
		</script>
	</body>
</html>
