<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Passport</title>
<style>
  :root { --ink:#12302d; --muted:#4d6662; --bg:#eef3f1; --paper:#fff; --green:#1f6f5c; --gold:#e8ad2b; --line:#c9d8d3; }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px 16px 40px; background:var(--bg); color:var(--ink);
         font-family:'Noto Sans Malayalam','Manjari','Nirmala UI',system-ui,sans-serif; font-size:18px; line-height:1.6; }
  main { max-width:560px; margin:0 auto; }
  a.back { color:var(--green); font-size:16px; }
  h1 { font-size:26px; margin:16px 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:16px; }
  .strands { list-style:none; margin:0; padding:0; display:grid; gap:12px; }
  .strand { background:var(--paper); border:2px solid var(--line); padding:14px 18px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .gate { font-size:20px; font-weight:700; }
  .gate small { font-weight:400; color:var(--muted); font-size:15px; margin-left:6px; }
  .label { font-weight:600; text-transform:capitalize; }
  .meta { color:var(--muted); font-size:15px; margin:2px 0 8px; }
  .track { height:18px; background:#e3ebe8; }
  .fill { height:100%; background:var(--green); }
  .strand[data-label="developing"] .fill { background:#5a9a8a; }
  .strand[data-label="needs support"] .fill { background:var(--gold); }
  .strand[data-label="not enough evidence yet"] .fill { background:#9fb3ae; }
  .flag { margin:8px 0 0; font-size:15px; color:#7a5200; background:#fdf3d8; padding:4px 10px; display:inline-block; }
  #sample-note[hidden] { display:none; }
  #offline-note { color:var(--muted); font-size:15px; margin:14px 0 0; }
  .next { border-left:6px solid var(--gold); background:var(--paper); padding:12px 16px; margin-top:20px; }
  .next .tag { display:block; color:var(--muted); font-size:14px; }
  .next p { margin:0; font-size:20px; }
  .next .ml { margin-top:4px; }
  #empty { background:var(--paper); border:2px dashed var(--line); padding:20px; }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">&larr; Back</a>
  <a class="back" id="sample-link" href="passport.html?sample=1" style="float:right">View sample passport</a>
  <h1>My Learning Passport</h1>
  <p class="sub" id="topic"></p>
  <p id="sample-note" class="flag" hidden>Demo only: these are fictional sample answers, not the child's actual record.</p>

  <div id="empty" hidden></div>

  <section id="passport" hidden>
    <ol class="strands" id="strands"></ol>
    <p id="offline-note" hidden>Answers gathered offline count for less, because they were checked with a tap instead of the AI.</p>
    <div class="next">
      <span class="tag">Next 15 minutes</span>
      <p id="next-en"></p>
      <p class="ml" id="next-ml"></p>
    </div>
  </section>
</main>

<script src="store.js"></script>
<script src="rules.js"></script>
<script>
const params = new URLSearchParams(location.search);
const sample = params.get('sample') === '1';   // fake evidence for demos
const $ = id => document.getElementById(id);
function showEmpty(msg) { $('empty').textContent = msg; $('empty').hidden = false; }

function sampleEvidence(conceptId) {
  const answers = [
    ['understand', 'pass', 'high', 'online'],
    ['understand', 'pass', 'high', 'online'],
    ['understand', 'fail', 'high', 'online'],
    ['understand', 'pass', 'high', 'online'],
    ['express', 'pass', 'high', 'online'],
    ['express', 'pass', 'high', 'online'],
    ['express', 'pass', 'high', 'online'],
    ['express', 'fail', 'low', 'offline'],
    ['apply', 'pass', 'high', 'online'],
    ['apply', 'fail', 'high', 'online'],
    ['apply', 'pass', 'low', 'offline']
  ];
  return answers.map(([gate, result, confidence, source], index) => ({
    concept: conceptId,
    gate,
    result,
    confidence,
    source,
    ts: Date.now() - (answers.length - index) * 60000
  }));
}

function buildPassport(evidence, conceptId) {
  const conceptEvidence = evidence.filter(item => item.concept === conceptId);
  if (!conceptEvidence.length) return { ok: false };

  const data = GATES.map(gate => {
    const state = gateState(conceptEvidence, conceptId, gate);
    return {
      gate,
      n: state.n,
      estimate: state.estimate,
      label: state.label,
      offline: conceptEvidence.filter(item => item.gate === gate && (item.confidence === 'low' || item.source === 'offline')).length
    };
  });
  data.sort((a, b) => {
    const aReady = a.n >= 3 ? 1 : 0;
    const bReady = b.n >= 3 ? 1 : 0;
    return bReady - aReady || b.estimate - a.estimate || GATES.indexOf(a.gate) - GATES.indexOf(b.gate);
  });

  return {
    ok: true,
    strands: data,
    offlineTotal: data.reduce((total, strand) => total + strand.offline, 0),
    next: nextActivity(conceptEvidence, conceptId)
  };
}

// Malayalam names are a convenience. P1's reviewer should check them.
const GATE_NAMES = {
  understand: { en: 'Understand', ml: 'മനസ്സിലാക്കൽ' },
  express: { en: 'Express', ml: 'പറയൽ' },
  apply: { en: 'Apply', ml: 'പ്രയോഗം' }
};
const GATES = ['understand', 'express', 'apply'];

function strandItem(s) {
  const li = document.createElement('li');
  li.className = 'strand';
  li.dataset.label = s.label;

  const row = document.createElement('div'); row.className = 'row';
  const gate = document.createElement('span'); gate.className = 'gate';
  gate.textContent = GATE_NAMES[s.gate].en;
  const ml = document.createElement('small'); ml.textContent = GATE_NAMES[s.gate].ml;
  gate.appendChild(ml);
  const label = document.createElement('span'); label.className = 'label'; label.textContent = s.label;
  row.append(gate, label);

  const meta = document.createElement('p'); meta.className = 'meta';
  meta.textContent = s.n + (s.n === 1 ? ' answer so far' : ' answers so far');

  const track = document.createElement('div'); track.className = 'track';
  track.setAttribute('role', 'img');
  track.setAttribute('aria-label', GATE_NAMES[s.gate].en + ': ' + s.label);
  const fill = document.createElement('div'); fill.className = 'fill';
  fill.style.width = (s.n > 0 ? Math.round(s.estimate * 100) : 0) + '%';
  track.appendChild(fill);

  li.append(row, meta, track);

  if (s.offline > 0) {   // flag lower-confidence evidence
    const flag = document.createElement('p'); flag.className = 'flag';
    flag.textContent = 'Includes ' + s.offline + ' offline ' + (s.offline === 1 ? 'answer' : 'answers') + ' (lower confidence)';
    li.appendChild(flag);
  }
  return li;
}

async function init() {
  let pack;
  try {
    const response = await fetch('pack.json');
    if (!response.ok) throw new Error('Learning content could not be loaded.');
    pack = await response.json();
  } catch (e) {
    showEmpty('Learning content could not be loaded. Please reload and try again.');
    return;
  }

  const childId = params.get('child');
  if (!childId && !sample) { showEmpty('Pick a child in the app first, then open this page.'); return; }

  const concepts = Array.isArray(pack.concepts) ? pack.concepts : [];
  const firstConcept = concepts[0]?.id;
  let conceptId = params.get('concept'), evidence;
  if (sample) {
    conceptId = conceptId || firstConcept || 'evap_rate';
    evidence = sampleEvidence(conceptId);
  } else {
    evidence = loadEvidence(childId);
    evidence = Array.isArray(evidence) ? evidence : [];
    const knownConcepts = new Set(concepts.map(concept => concept.id));
    const latest = [...evidence]
      .filter(item => knownConcepts.has(item.concept))
      .sort((a, b) => (b.ts || 0) - (a.ts || 0))[0];
    conceptId = conceptId || latest?.concept || firstConcept;
  }

  const data = buildPassport(evidence, conceptId);
  if (!data.ok) { showEmpty('No evidence yet. Finish a session and your passport will fill in.'); return; }

  const concept = concepts.find(c => c.id === conceptId);
  let childName = sample ? 'Demo learner' : `Child ${childId}`;
  if (childId) {
    try {
      const children = JSON.parse(localStorage.getItem('bb_children') || '[]');
      childName = children.find(child => child.id === childId)?.nick || childName;
    } catch (e) {}
  }
  $('topic').textContent = `${childName} · ${pack.chapter || 'Learning progress'}${concept ? ': ' + concept.title.en : ''}${sample ? ' · SAMPLE DATA' : ''}`;
  $('sample-note').hidden = !sample;
  $('sample-link').hidden = sample;
  if (childId) $('sample-link').href = `passport.html?child=${encodeURIComponent(childId)}&sample=1`;

  data.strands.forEach(s => $('strands').appendChild(strandItem(s)));   // strengths first
  $('offline-note').hidden = data.offlineTotal === 0;

  // Next activity: English from rules.js; Malayalam from pack.next_activity if P1 has added it.
  $('next-en').textContent = data.next.text;
  const na = pack.next_activity && pack.next_activity[data.next.gate];
  $('next-ml').textContent = na ? (typeof na === 'object' ? na.ml : na) : '';
  $('passport').hidden = false;
}
init().catch(() => showEmpty('Could not build the passport. Please reload and try again.'));
</script>
</body>
</html>
