<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Passport</title>
  <style>
    :root {
      --bg: #f6f9f8;
      --ink: #14302b;
      --muted: #5b716c;
      --track: #dbe6e3;
      --strong: #1f8a5b;
      --developing: #e0a100;
      --support: #d2552f;
      --none: #8fa19d;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101c1a;
        --ink: #e8f2ef;
        --muted: #9db3ae;
        --track: #2b3d39;
        --card: #182826;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 40px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Malayalam", sans-serif;
      font-size: 18px;
      line-height: 1.5;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; }

    .strand {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .name { font-size: 1.2rem; font-weight: 700; }
    .label { font-weight: 700; }
    .label.strong { color: var(--strong); }
    .label.developing { color: var(--developing); }
    .label.support { color: var(--support); }
    .label.none { color: var(--none); }

    .bar { height: 18px; background: var(--track); border-radius: 9px; margin: 10px 0 8px; overflow: hidden; }
    .fill { height: 100%; border-radius: 9px; }
    .fill.strong { background: var(--strong); }
    .fill.developing { background: var(--developing); }
    .fill.support { background: var(--support); }
    .fill.none { background: var(--none); }

    .meta { color: var(--muted); font-size: 0.95rem; }
    .lowconf {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 10px;
      border: 2px dashed var(--muted);
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .next {
      background: var(--ink);
      color: var(--bg);
      border-radius: 14px;
      padding: 18px 16px;
      margin-top: 22px;
    }
    .next h2 { margin: 0 0 6px; font-size: 1.1rem; }
    .next p { margin: 0; font-size: 1.15rem; }

    .note { margin-top: 18px; font-size: 0.9rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Learning Passport</h1>
    <p class="sub" id="sub"></p>

    <div id="strands"></div>

    <section class="next" aria-live="polite">
      <h2>Next 15 minutes</h2>
      <p id="nextText"></p>
    </section>

    <p class="note" id="note"></p>
  </main>

  <!-- Same load order as the rest of the app: store.js first, then rules.js -->
  <script src="store.js"></script>
  <script src="rules.js"></script>
  <script>
    // ---------------------------------------------------------------
    // SETTINGS: change these two lines when real evidence is ready
    // ---------------------------------------------------------------
    const USE_FAKE = true;                       // set to false on Day 2
    const CONCEPT_ID = 'evap_rate';
    // Child code comes from the link, e.g. passport.html?child=S02
    const CHILD_ID = new URLSearchParams(location.search).get('child') || 'S01';

    // ---------------------------------------------------------------
    // Fake evidence (same shape as the evidence item in section 6)
    // ---------------------------------------------------------------
    const FAKE_EVIDENCE = [
      { concept: 'evap_rate', gate: 'understand', result: 'fail', confidence: 'high', source: 'online',  misconception: 'amount_decides', ts: 1731000000000 },
      { concept: 'evap_rate', gate: 'understand', result: 'pass', confidence: 'high', source: 'online',  ts: 1731000100000 },
      { concept: 'evap_rate', gate: 'understand', result: 'pass', confidence: 'low',  source: 'offline', ts: 1731000200000 },
      { concept: 'evap_rate', gate: 'express',    result: 'fail', confidence: 'high', source: 'online',  ts: 1731000300000 },
      { concept: 'evap_rate', gate: 'express',    result: 'fail', confidence: 'high', source: 'online',  ts: 1731000400000 },
      { concept: 'evap_rate', gate: 'express',    result: 'pass', confidence: 'high', source: 'online',  ts: 1731000500000 },
      { concept: 'evap_rate', gate: 'apply',      result: 'pass', confidence: 'high', source: 'online',  ts: 1731000600000 },
      { concept: 'evap_rate', gate: 'apply',      result: 'pass', confidence: 'high', source: 'online',  ts: 1731000700000 },
      { concept: 'evap_rate', gate: 'apply',      result: 'pass', confidence: 'low',  source: 'offline', ts: 1731000800000 },
      { concept: 'evap_rate', gate: 'apply',      result: 'pass', confidence: 'high', source: 'online',  ts: 1731000900000 }
    ];

    const STRANDS = [
      { gate: 'understand', name: 'Understand' },
      { gate: 'express',    name: 'Express' },
      { gate: 'apply',      name: 'Apply' }
    ];

    // Turn the label from rules.js into a CSS class
    function labelClass(label) {
      if (label === 'strong') return 'strong';
      if (label === 'developing') return 'developing';
      if (label === 'needs support') return 'support';
      return 'none';
    }

    // Count how many pieces of evidence for this gate came from offline
    function countOffline(evidence, conceptId, gate) {
      return evidence.filter(e =>
        e.concept === conceptId && e.gate === gate && e.confidence === 'low'
      ).length;
    }

    function render() {
      const evidence = USE_FAKE ? FAKE_EVIDENCE : loadEvidence(CHILD_ID);

      document.getElementById('sub').textContent =
        'Child ' + CHILD_ID + ' · Evaporation, Class 7' + (USE_FAKE ? ' · sample data' : '');

      // Work out each strand using P4's own rules.js
      const strands = STRANDS.map(s => {
        const state = gateState(evidence, CONCEPT_ID, s.gate);
        return {
          name: s.name,
          gate: s.gate,
          n: state.n,
          estimate: state.estimate,
          label: state.label,
          offline: countOffline(evidence, CONCEPT_ID, s.gate)
        };
      });

      // Strengths first: highest estimate at the top
      // (strands with too little evidence go to the bottom)
      strands.sort((a, b) => {
        const aReady = a.n >= 3 ? 1 : 0;
        const bReady = b.n >= 3 ? 1 : 0;
        if (aReady !== bReady) return bReady - aReady;
        return b.estimate - a.estimate;
      });

      const container = document.getElementById('strands');
      container.innerHTML = '';

      strands.forEach(s => {
        const cls = labelClass(s.label);
        const pct = Math.round(s.estimate * 100);

        const card = document.createElement('div');
        card.className = 'strand';

        const row = document.createElement('div');
        row.className = 'row';
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = s.name;
        const label = document.createElement('span');
        label.className = 'label ' + cls;
        label.textContent = s.label;
        row.append(name, label);

        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.setAttribute('role', 'img');
        bar.setAttribute('aria-label', s.name + ' progress ' + pct + ' percent');
        const fill = document.createElement('div');
        fill.className = 'fill ' + cls;
        fill.style.width = pct + '%';
        bar.appendChild(fill);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = s.n + (s.n === 1 ? ' answer' : ' answers') + ' so far';

        card.append(row, bar, meta);

        if (s.offline > 0) {
          const flag = document.createElement('div');
          flag.className = 'lowconf';
          flag.textContent = s.offline + ' of these gathered offline (lower confidence)';
          card.appendChild(flag);
        }

        container.appendChild(card);
      });

      // End with the next activity from rules.js
      const next = nextActivity(evidence, CONCEPT_ID);
      document.getElementById('nextText').textContent = next.text;

      const anyOffline = strands.some(s => s.offline > 0);
      document.getElementById('note').textContent = anyOffline
        ? 'Answers gathered offline count half as much as online answers.'
        : '';
    }

    render();
  </script>
</body>
</html>
