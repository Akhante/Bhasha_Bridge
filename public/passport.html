<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BhashaBridge · Concept Passport</title>
    <style>
      :root {
        --bg: #f2f7f3;
        --card: #ffffff;
        --ink: #102a27;
        --muted: #53716b;
        --track: #d2e3de;
        --strong: #0f766e;
        --developing: #b45309;
        --support: #c2410c;
        --none: #64748b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px 16px 40px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Noto Sans Malayalam",
          sans-serif;
      }
      main {
        max-width: 600px;
        margin: 0 auto;
      }
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      .back-btn {
        text-decoration: none;
        font-size: 0.9rem;
        background: var(--track);
        padding: 6px 12px;
        border-radius: 8px;
        color: var(--ink);
        font-weight: 600;
      }

      /* Concept Tabs */
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .tab {
        background: var(--card);
        border: 2px solid var(--track);
        padding: 8px 14px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        color: var(--muted);
      }
      .tab.active {
        background: var(--strong);
        color: #fff;
        border-color: var(--strong);
      }

      .strand {
        background: var(--card);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .name {
        font-size: 1.1rem;
        font-weight: 700;
      }
      .label {
        font-weight: 700;
        font-size: 0.95rem;
        text-transform: uppercase;
      }
      .label.strong {
        color: var(--strong);
      }
      .label.developing {
        color: var(--developing);
      }
      .label.support {
        color: var(--support);
      }
      .label.none {
        color: var(--none);
      }

      .bar {
        height: 14px;
        background: var(--track);
        border-radius: 7px;
        margin: 10px 0 6px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        border-radius: 7px;
        transition: width 0.4s ease;
      }
      .fill.strong {
        background: var(--strong);
      }
      .fill.developing {
        background: var(--developing);
      }
      .fill.support {
        background: var(--support);
      }
      .fill.none {
        background: var(--none);
      }

      .meta {
        color: var(--muted);
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
      }

      /* Evidence Accordion */
      .evidence-toggle {
        background: none;
        border: none;
        color: var(--strong);
        font-weight: 600;
        cursor: pointer;
        padding: 0;
        margin-top: 8px;
        font-size: 0.85rem;
      }
      .evidence-log {
        margin-top: 10px;
        border-top: 1px dashed var(--track);
        padding-top: 8px;
        font-size: 0.85rem;
        display: none;
      }
      .evidence-log.open {
        display: block;
      }
      .ev-item {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid #f0f4f2;
      }

      .next {
        background: var(--ink);
        color: var(--bg);
        border-radius: 14px;
        padding: 18px;
        margin-top: 20px;
      }
      .next h2 {
        margin: 0 0 6px;
        font-size: 1.05rem;
      }
      .next p {
        margin: 0 0 14px;
        font-size: 1.1rem;
      }
      .action-link {
        display: inline-block;
        background: #fff;
        color: var(--ink);
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="header-row">
        <h1 id="title">Learning Passport</h1>
        <a class="back-btn" href="index.html">← Back to App</a>
      </div>
      <p
        id="sub"
        style="color: var(--muted); margin-top: 0; margin-bottom: 16px"
      ></p>

      <!-- Concept Switching Tabs -->
      <div class="tabs" id="conceptTabs"></div>

      <div id="strands"></div>

      <section class="next">
        <h2>Recommended Next 15 Minutes</h2>
        <p id="nextText"></p>
        <a class="action-link" id="practiceLink" href="index.html"
          >Start Practice Session</a
        >
      </section>
    </main>

    <script src="store.js"></script>
    <script src="rules.js"></script>
    <script>
      const CHILD_ID =
        new URLSearchParams(location.search).get("child") || "S01";
      let currentConcept = "evap_rate";

      function renderPassport() {
        // Safe fallbacks to prevent runtime crashes
        const evidence =
          typeof loadEvidence === "function" ? loadEvidence(CHILD_ID) : [];

        // Fixed string interpolation syntax
        const subEl = document.getElementById("sub");
        if (subEl) {
          subEl.textContent = `Child ID: ${CHILD_ID} · Class 7 Science (SCERT Kerala)`;
        }

        const container = document.getElementById("strands");
        if (!container) return;
        container.innerHTML = "";

        STRANDS.forEach((s) => {
          // Safe fallback if gateState is missing
          const state =
            typeof gateState === "function"
              ? gateState(evidence, currentConcept, s.gate)
              : { n: 0, estimate: 0, label: "not enough evidence yet" };

          const cls = labelClass(state.label);
          const pct = Math.round(state.estimate * 100);
          const gateEvidence = evidence.filter(
            (e) => e.concept === currentConcept && e.gate === s.gate,
          );

          const card = document.createElement("div");
          card.className = "strand";
          card.innerHTML = `
        <div class="row">
          <span class="name">${s.name}</span>
          <span class="label ${cls}">${state.label}</span>
        </div>
        <div class="bar"><div class="fill ${cls}" style="width: ${pct}%"></div></div>
        <div class="meta">
          <span>${state.n} evidence items (Beta est: ${pct}%)</span>
          <span>${gateEvidence.filter((e) => e.confidence === "low").length} offline / low-conf</span>
        </div>
        ${
          gateEvidence.length > 0
            ? `
          <button class="evidence-toggle" onclick="toggleLog(this)">View Evidence Log (${gateEvidence.length})</button>
          <div class="evidence-log">
            ${gateEvidence
              .map(
                (e) => `
              <div class="ev-item">
                <span>Result: <b>${e.result}</b> (${e.source})</span>
                <span>${e.misconception ? "Misconception: " + e.misconception : "Correct"}</span>
              </div>
            `,
              )
              .join("")}
          </div>
        `
            : ""
        }
      `;
          container.appendChild(card);
        });

        if (typeof nextActivity === "function") {
          const next = nextActivity(evidence, currentConcept);
          const nextTextEl = document.getElementById("nextText");
          if (nextTextEl) nextTextEl.textContent = next.text;
        }
      }
    </script>
  </body>
</html>
