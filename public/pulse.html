<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parent Pulse</title>
  <style>
    :root {
      --bg: #f6f9f8;
      --ink: #14302b;
      --muted: #5b716c;
      --card: #ffffff;
      --accent: #1f8a5b;
      --accent-ink: #ffffff;
      --warn: #d2552f;
      --line: #c5d6d2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101c1a;
        --ink: #e8f2ef;
        --muted: #9db3ae;
        --card: #182826;
        --accent: #3cb27d;
        --accent-ink: #0b1a16;
        --line: #2f4540;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 16px 40px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Malayalam", sans-serif;
      font-size: 18px;
      line-height: 1.6;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }

    .privacy {
      border: 2px dashed var(--muted);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 1rem;
    }

    .message {
      background: var(--card);
      border-radius: 14px;
      padding: 8px 16px;
      margin-bottom: 18px;
    }
    .part { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .part:last-child { border-bottom: 0; }
    .part .ml { font-size: 1.2rem; margin: 0; }
    .part .en { font-size: 0.9rem; color: var(--muted); margin: 4px 0 0; }
    .tag { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin: 0 0 2px; }

    .actions { display: flex; flex-direction: column; gap: 12px; }
    button {
      font: inherit;
      font-weight: 700;
      min-height: 56px;
      border-radius: 14px;
      border: 2px solid var(--accent);
      padding: 10px 16px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: var(--accent-ink); }
    button.secondary { background: transparent; color: var(--ink); border-color: var(--muted); }
    button:disabled { opacity: 0.6; cursor: default; }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    .status { min-height: 1.6em; margin: 12px 0 0; color: var(--muted); font-size: 0.95rem; }
    .empty, .error {
      background: var(--card); border-radius: 14px; padding: 20px 16px; text-align: center;
    }
    .error { border: 2px solid var(--warn); }
    .empty a { color: var(--ink); font-weight: 700; }
    .links { margin: 0 0 16px; display: flex; flex-wrap: wrap; gap: 10px; }
    .links a {
      padding: 6px 14px; border: 2px solid var(--muted); border-radius: 999px;
      text-decoration: none; color: var(--ink); font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Parent Pulse</h1>
    <p class="sub" id="sub"></p>
    <div class="links" id="links"></div>

    <div id="content" hidden>
      <p class="privacy" id="privacy"></p>

      <div class="message" id="message"></div>

      <div class="actions">
        <button class="primary" id="playBtn" type="button">Play message</button>
        <button class="secondary" id="shareBtn" type="button">Send to parent</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <div id="notice"></div>
  </main>

  <script src="store.js"></script>
  <script src="rules.js"></script>
  <script>
    // ---------------------------------------------------------------
    // Settings
    //   ?child=ID     which child (otherwise found from this phone)
    //   ?concept=ID   which concept (otherwise the most recent one)
    //   ?demo=1       use sample evidence for demos and tests
    // ---------------------------------------------------------------
    const params = new URLSearchParams(location.search);
    const DEMO = params.get('demo') === '1';
    const KEY_PREFIX = 'bb_evidence_';                 // must match store.js
    // Pre-generated clip used when offline or when /api/tts fails.
    // Add "pulse_backup.wav" to audio-list.json and run make-audio.js
    const BACKUP_AUDIO = '/audio/pulse_backup.wav';
    const GATES = ['understand', 'express', 'apply'];

    const DEMO_EVIDENCE = [
      { concept: 'evap_rate', gate: 'understand', result: 'pass', confidence: 'high', source: 'online', ts: 1731000000000 },
      { concept: 'evap_rate', gate: 'understand', result: 'pass', confidence: 'high', source: 'online', ts: 1731000100000 },
      { concept: 'evap_rate', gate: 'understand', result: 'pass', confidence: 'high', source: 'online', ts: 1731000200000 },
      { concept: 'evap_rate', gate: 'express',    result: 'fail', confidence: 'high', source: 'online', ts: 1731000300000 },
      { concept: 'evap_rate', gate: 'express',    result: 'fail', confidence: 'high', source: 'online', ts: 1731000400000 },
      { concept: 'evap_rate', gate: 'apply',      result: 'pass', confidence: 'high', source: 'online', ts: 1731000500000 }
    ];

    let parts = [];          // [{ tag, ml, en }] the message, in order
    let player = null;       // the audio currently playing

    function $(id) { return document.getElementById(id); }

    function say(text) { $('status').textContent = text; }

    // Pack strings may be plain text or { ml, en }. Ignore empty and "..." placeholders.
    function pick(value, lang) {
      if (!value) return '';
      const t = typeof value === 'string' ? (lang === 'ml' ? value : '') : (value[lang] || '');
      return t === '...' ? '' : t;
    }

    function findChildren() {
      const ids = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(KEY_PREFIX) === 0) ids.push(k.slice(KEY_PREFIX.length));
      }
      return ids;
    }

    async function loadPack() {
      const r = await fetch('/pack.json');
      if (!r.ok) throw new Error('pack.json could not be loaded');
      return await r.json();
    }

    function link(text, href) {
      const a = document.createElement('a');
      a.textContent = text;
      a.href = href;
      return a;
    }

    function showNotice(text, isError, withStartLink) {
      const box = document.createElement('div');
      box.className = isError ? 'error' : 'empty';
      const p = document.createElement('p');
      p.textContent = text;
      box.appendChild(p);
      if (withStartLink) box.appendChild(link('Start a session', '/'));
      $('notice').textContent = '';
      $('notice').appendChild(box);
    }

    // ---------------------------------------------------------------
    // Build the message from templates (no AI writing)
    // ---------------------------------------------------------------
    function buildParts(pack, evidence, conceptId) {
      // Only gates the child has actually answered, strongest first
      const ranked = GATES
        .map(g => ({ gate: g, s: gateState(evidence, conceptId, g) }))
        .filter(x => x.s.n > 0)
        .sort((a, b) => b.s.estimate - a.s.estimate);

      const out = [];
      if (!ranked.length) return out;

      const strongest = ranked[0].gate;
      const weakest = ranked[ranked.length - 1].gate;
      const pulse = pack.pulse || {};

      const strongText = pick((pulse.strong || {})[strongest], 'ml');
      if (strongText) out.push({ tag: 'Something your child did well', ml: strongText, en: pick((pulse.strong || {})[strongest], 'en') });

      // Only add a support sentence if there is a different gate to support
      if (ranked.length > 1 && weakest !== strongest) {
        const supText = pick((pulse.support || {})[weakest], 'ml');
        if (supText) out.push({ tag: 'Something to practise together', ml: supText, en: pick((pulse.support || {})[weakest], 'en') });
      }

      const dq = (pack.dinner_questions || {})[conceptId];
      const dqMl = pick(dq, 'ml');
      if (dqMl) out.push({ tag: 'A question for dinner', ml: dqMl, en: pick(dq, 'en') });

      return out;
    }

    function showMessage() {
      const box = $('message');
      box.textContent = '';
      parts.forEach(p => {
        const wrap = document.createElement('div');
        wrap.className = 'part';
        const tag = document.createElement('p');
        tag.className = 'tag';
        tag.textContent = p.tag;
        const ml = document.createElement('p');
        ml.className = 'ml';
        ml.lang = 'ml';
        ml.textContent = p.ml;
        wrap.append(tag, ml);
        if (p.en) {
          const en = document.createElement('p');
          en.className = 'en';
          en.lang = 'en';
          en.textContent = p.en;
          wrap.appendChild(en);
        }
        box.appendChild(wrap);
      });
    }

    // ---------------------------------------------------------------
    // Audio
    // ---------------------------------------------------------------
    function stopAudio() {
      if (player) { player.pause(); player = null; }
    }

    function playSrc(src) {
      return new Promise((resolve, reject) => {
        const a = new Audio(src);
        player = a;
        a.onended = resolve;
        a.onerror = () => reject(new Error('audio error'));
        a.play().catch(reject);
      });
    }

    async function ttsClip(text) {
      const r = await fetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });
      if (!r.ok) throw new Error('tts failed');
      const data = await r.json();
      if (!data.audioBase64) throw new Error('no audio');
      return 'data:audio/wav;base64,' + data.audioBase64;
    }

    async function playBackup() {
      say('Playing the saved sample message.');
      await playSrc(BACKUP_AUDIO);
      say('');
    }

    async function onPlay() {
      const btn = $('playBtn');
      btn.disabled = true;
      stopAudio();
      try {
        if (!navigator.onLine) throw new Error('offline');
        say('Getting the voice message ready…');
        // One short request per sentence, played in order
        const clips = await Promise.all(parts.map(p => ttsClip(p.ml)));
        say('Playing…');
        for (const src of clips) await playSrc(src);
        say('');
      } catch (err) {
        console.error(err);
        try {
          await playBackup();
        } catch (e2) {
          say('Sound could not play. Tap Play message again, or read the text.');
        }
      } finally {
        btn.disabled = false;
      }
    }

    // ---------------------------------------------------------------
    // Send: only the text shown on screen is shared
    // ---------------------------------------------------------------
    async function onShare() {
      const text = parts.map(p => p.ml + (p.en ? '\n(' + p.en + ')' : '')).join('\n\n');
      try {
        if (navigator.share) {
          await navigator.share({ title: 'BhashaBridge', text: text });
          say('Message shared.');
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(text);
          say('Message copied. Paste it into a chat with your parent.');
        } else {
          say('Sharing is not available on this phone. Read the message to your parent.');
        }
      } catch (err) {
        // The child closed the share sheet: nothing was sent
        say('');
      }
    }

    // ---------------------------------------------------------------
    // Start
    // ---------------------------------------------------------------
    async function start() {
      if (typeof gateState !== 'function' || typeof loadEvidence !== 'function') {
        throw new Error('store.js or rules.js did not load.');
      }

      const pack = await loadPack();

      let childId = DEMO ? 'S01' : params.get('child');
      if (!childId) {
        const kids = findChildren();
        if (kids.length === 1) {
          childId = kids[0];
        } else if (kids.length > 1) {
          $('sub').textContent = 'Whose message?';
          kids.forEach(k => $('links').appendChild(link(k, '?child=' + encodeURIComponent(k))));
          return;
        }
      }
      if (!childId) {
        showNotice('No progress saved on this phone yet. Finish a session first.', false, true);
        return;
      }

      const all = DEMO ? DEMO_EVIDENCE : loadEvidence(childId);
      if (!all.length) {
        showNotice('No answers saved yet. Finish a session first.', false, true);
        return;
      }

      let conceptId = params.get('concept');
      if (!conceptId || !all.some(e => e.concept === conceptId)) {
        const latest = all.reduce((a, b) => ((b.ts || 0) >= (a.ts || 0) ? b : a));
        conceptId = latest.concept;
      }
      const evidence = all.filter(e => e.concept === conceptId);

      parts = buildParts(pack, evidence, conceptId);
      if (!parts.length) {
        showNotice('The message text is not ready yet. Ask the content lead to fill the pulse and dinner_questions sections of pack.json.', true, false);
        return;
      }

      $('sub').textContent = 'A short message for your parent' + (DEMO ? ' · sample data' : '');
      $('privacy').textContent =
        'What will be sent: only the message below. No scores, no answers, no recordings and no name.';
      showMessage();
      $('content').hidden = false;
      $('playBtn').addEventListener('click', onPlay);
      $('shareBtn').addEventListener('click', onShare);
    }

    start().catch(err => {
      console.error(err);
      showNotice('Parent Pulse error: ' + err.message, true, false);
    });
  </script>
</body>
</html>
